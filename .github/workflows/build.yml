name: Build AlteIsland APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack zip (or use files as is)
        id: loc
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            z=$(ls *.zip 2>/dev/null | head -1)
            if [ -z "$z" ]; then echo "Zip not uploaded yet, nothing to build"; exit 0; fi
            mkdir -p _src && unzip -q "$z" -d _src
            d=$(dirname "$(find _src -name settings.gradle.kts | head -1)")
            echo "dir=$d" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.loc.outputs.dir != ''
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: steps.loc.outputs.dir != ''
        with:
          gradle-version: 8.7
      - name: Build APK
        if: steps.loc.outputs.dir != ''
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle assembleDebug --no-daemon
      - name: Collect APK
        if: steps.loc.outputs.dir != ''
        run: |
          mkdir -p out
          cp "$(find . -path '*outputs/apk/debug/*.apk' | head -1)" out/AlteIsland.apk
      - name: Publish to Releases
        if: steps.loc.outputs.dir != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" out/AlteIsland.apk \
            --title "AlteIsland build ${{ github.run_number }}" \
            --notes "Скачай AlteIsland.apk и установи на телефон"
