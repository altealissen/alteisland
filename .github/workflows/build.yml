name: Build APK from ZIP
on:
  workflow_dispatch:
  push:
    paths: ["*.zip", ".github/workflows/build-apk.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack ZIP
        run: |
          set -e
          ZIP=$(ls -t ./*.zip | head -n1) || { echo "No .zip in repo root"; exit 1; }
          echo "Using $ZIP"
          rm -rf _src && mkdir _src && unzip -q "$ZIP" -d _src
          SETTINGS=$(find _src -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n1)
          [ -n "$SETTINGS" ] || { echo "settings.gradle(.kts) not found in ZIP"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AlteCam-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: ${{ env.PROJECT_DIR }}/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
